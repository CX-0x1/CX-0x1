    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f0d878;
            --dark: #050505;
            --card: rgba(10, 10, 10, 0.72);
            --text: #ffffff;
            --muted: #b8b8b8;
            --soft-muted: #969696;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: var(--dark);
        }

        body {
            min-height: 100vh;
            width: 100%;
            overflow: hidden;
            position: relative;
            color: var(--text);
            background-color: var(--dark);
            background-image: radial-gradient(#252525 1px, transparent 1px);
            background-size: 25px 25px;
            font-family: "Poppins", Arial, sans-serif;
            font-weight: 400;
            line-height: 1.5;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: auto;
            -moz-osx-font-smoothing: auto;
        }

        ::selection {
            color: #ffffff;
            background: rgba(212, 175, 55, 0.5);
        }

        a,
        button,
        input {
            font: inherit;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(212, 175, 55, 0.25);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .click-text {
            color: #ffffff;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 0 0 16px rgba(212, 175, 55, 0.65);
            transition: 0.3s ease;
        }

        .click-text:hover {
            color: var(--gold-light);
            transform: scale(1.04);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .main-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            perspective: 1200px;
        }

        #bg-video {
            position: fixed;
            z-index: -2;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(3px) brightness(0.55);
            transform: scale(1.05);
        }

        #snow-canvas {
            position: fixed;
            z-index: 1;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #audio-visualizer {
            position: fixed;
            z-index: 4;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            pointer-events: none;
        }

        .cursor-dot,
        .cursor-outline {
            position: fixed;
            z-index: 200000;
            pointer-events: none;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-dot {
            width: 6px;
            height: 6px;
            background: #ffffff;
            transition: 0.25s ease;
        }

        .cursor-outline {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            transition: width 0.25s ease, height 0.25s ease,
                border-color 0.25s ease, background 0.25s ease;
        }

        .cursor-hover .cursor-dot {
            width: 4px;
            height: 4px;
            background: var(--gold);
        }

        .cursor-hover .cursor-outline {
            width: 42px;
            height: 42px;
            border-color: rgba(212, 175, 55, 0.6);
            background: rgba(212, 175, 55, 0.1);
        }

        .card {
            position: relative;
            z-index: 10;
            width: 440px;
            max-width: calc(100% - 32px);
            margin: 24px auto;
            padding: 42px 38px 86px;
            overflow: hidden;
            text-align: center;
            background: var(--card);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 32px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform-style: preserve-3d;
            transition: box-shadow 0.4s ease;
        }

        .card::after {
            position: absolute;
            z-index: 20;
            inset: 0;
            content: "";
            pointer-events: none;
            background: radial-gradient(
                circle at var(--glare-x, 50%) var(--glare-y, 50%),
                rgba(255, 255, 255, 0.1),
                transparent 60%
            );
        }

        .card:hover {
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.2);
        }

        .profile-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
            transform: translateZ(50px);
            transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .profile-wrapper:hover {
            transform: translateZ(80px) scale(1.08) rotate(4deg);
        }

        .profile-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0a0a0a;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            transition: 0.4s ease;
        }

        .profile-wrapper:hover .profile-img {
            border-color: var(--gold);
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.5);
        }

        .status-indicator {
            position: absolute;
            right: 5px;
            bottom: 5px;
            z-index: 2;
            width: 24px;
            height: 24px;
            background: #747f8d;
            border: 4px solid #0a0a0a;
            border-radius: 50%;
        }

        .status-online {
            background: #3ba55c;
            box-shadow: 0 0 12px #3ba55c;
        }

        .status-idle {
            background: #faa61a;
            box-shadow: 0 0 12px #faa61a;
        }

        .status-dnd {
            background: #ed4245;
            box-shadow: 0 0 12px #ed4245;
        }

        h1 {
            position: relative;
            z-index: 2;
            display: inline-block;
            margin-bottom: 7px;
            color: #ffffff;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(
                90deg,
                var(--gold),
                #ffffff,
                #aaaaaa,
                var(--gold)
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
            transform: translateZ(40px);
            animation: shine 5s linear infinite;
            transition: 0.4s ease;
        }

        h1:hover {
            transform: translateZ(60px) scale(1.05);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.65));
        }

        @keyframes shine {
            to {
                background-position: 300% center;
            }
        }

        .custom-status {
            display: block;
            min-height: 25px;
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 0.9rem;
            font-style: italic;
            font-weight: 500;
            transform: translateZ(30px);
            transition: 0.3s ease;
        }

        .custom-status:hover {
            color: #ffffff;
            transform: translateZ(45px) scale(1.02);
        }

        .badge {
            display: inline-block;
            margin-bottom: 25px;
            padding: 7px 17px;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 10px;
            box-shadow: 0 4px 0 rgba(212, 175, 55, 0.2);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            transform: translateZ(35px);
            transition: 0.3s ease;
        }

        .badge:hover {
            background: rgba(212, 175, 55, 0.22);
            border-color: var(--gold);
            box-shadow: 0 6px 0 rgba(212, 175, 55, 0.3);
            transform: translateY(-2px) translateZ(50px);
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 0 8px;
            transform: translateZ(35px);
        }

        .skill-badge {
            display: inline-block;
            padding: 5px 12px;
            color: #d0d0d0;
            background: rgba(192, 192, 192, 0.09);
            border: 1px solid rgba(192, 192, 192, 0.22);
            border-radius: 8px;
            box-shadow: 0 3px 0 rgba(192, 192, 192, 0.15);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: 0.3s ease;
        }

        .skill-badge:hover {
            color: #ffffff;
            background: rgba(192, 192, 192, 0.18);
            border-color: #d0d0d0;
            transform: translateY(-2px);
        }

        .activities-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: translateZ(20px);
        }

        .activity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            text-align: left;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            transition: 0.3s ease;
        }

        .activity-box:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(212, 175, 55, 0.4);
            transform: scale(1.02);
        }

        .activity-img {
            flex-shrink: 0;
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 14px;
        }

        .activity-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .activity-header {
            overflow: hidden;
            color: var(--gold);
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .activity-name {
            overflow: hidden;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .activity-details {
            overflow: hidden;
            color: #b0b0b0;
            font-size: 0.78rem;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bars {
            display: flex;
            align-items: flex-end;
            flex-shrink: 0;
            gap: 2px;
            height: 14px;
            margin-left: auto;
        }

        .bar {
            width: 3px;
            height: 20%;
            background: #1db954;
            animation: bounce 1s infinite ease-in-out;
        }

        @keyframes bounce {
            0%,
            100% {
                height: 20%;
            }

            50% {
                height: 100%;
            }
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 18px;
            background: rgba(212, 175, 55, 0.07);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateZ(25px);
            transition: 0.4s ease;
        }

        .social-links:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-5px) translateZ(40px);
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            font-size: 1.4rem;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .social-btn:hover {
            color: #000000;
            background: var(--gold);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.5);
            transform: translateY(-5px);
        }

        .social-btn svg {
            width: 22px;
            height: 22px;
        }

        .volume-control {
            position: absolute;
            bottom: 52px;
            left: 50%;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            width: max-content;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            transform: translateX(-50%);
            transition: 0.3s ease;
        }

        .volume-control:hover {
            border-color: rgba(212, 175, 55, 0.5);
        }

        .volume-icon {
            width: 20px;
            color: #dddddd;
            cursor: pointer;
            font-size: 1.1rem;
            text-align: center;
            transition: 0.2s ease;
        }

        .volume-icon:hover {
            color: var(--gold);
            transform: scale(1.1);
        }

        input[type="range"] {
            width: 100px;
            height: 4px;
            appearance: none;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            width: 13px;
            height: 13px;
            appearance: none;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--gold);
        }

        .view-counter {
            position: absolute;
            bottom: 15px;
            left: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            color: #c2c2c2;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .view-counter:hover {
            color: var(--gold);
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .view-counter i {
            animation: eye-pulse 2s infinite;
        }

        @keyframes eye-pulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }
        }

        @media (max-width: 768px) {
            body {
                min-height: 100vh;
                overflow-y: auto;
                background-size: 16px 16px;
            }

            .main-wrapper {
                min-height: 100vh;
                align-items: flex-start;
                padding: 30px 0;
                perspective: none;
            }

            .card {
                width: calc(100% - 28px);
                max-width: 440px;
                margin: 0 auto;
                padding: 34px 20px 92px;
                transform: none !important;
            }

            .card:hover {
                box-shadow: 0 10px 30px rgba(212, 175, 55, 0.12);
            }

            .profile-wrapper {
                transform: none;
            }

            .profile-wrapper:hover {
                transform: scale(1.04);
            }

            h1 {
                font-size: 1.75rem;
            }

            .cursor-dot,
            .cursor-outline {
                display: none;
            }

            #audio-visualizer {
                display: none;
            }

            .volume-control {
                bottom: 52px;
                width: 76%;
                justify-content: center;
            }

            input[type="range"] {
                flex: 1;
                width: auto;
            }

            .view-counter {
                right: 50%;
                left: auto;
                transform: translateX(50%);
            }
        }

        @media (max-width: 380px) {
            .card {
                padding-right: 15px;
                padding-left: 15px;
            }

            .activity-box {
                gap: 10px;
                padding: 12px;
            }

            .activity-img {
                width: 55px;
                height: 55px;
            }

            .social-links {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <div class="click-text">LOADING</div>
        </div>
    </div>

    <video id="bg-video" autoplay loop muted playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <audio id="bg-music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <canvas id="snow-canvas"></canvas>
    <canvas id="audio-visualizer"></canvas>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <main class="main-wrapper">
        <section class="card">

            <div class="profile-wrapper">
                <img id="avatar" class="profile-img" src="CX_logo.jpg" alt="CX_0x1 profile image">
                <div id="status-dot" class="status-indicator"></div>
            </div>

            <h1 id="username">CX_0x1</h1>

            <div id="custom-status" class="custom-status">
                SYSTEM ONLINE
            </div>

            <div class="badge">SYSTEM MASTER</div>

            <div class="skills-container">
                <span class="skill-badge">HTML</span>
                <span class="skill-badge">CSS</span>
                <span class="skill-badge">JAVASCRIPT</span>
                <span class="skill-badge">REACT</span>
                <span class="skill-badge">NODE.JS</span>
                <span class="skill-badge">PYTHON</span>
                <span class="skill-badge">C++</span>
                <span class="skill-badge">C#</span>
            </div>

            <div id="activities-wrapper" class="activities-wrapper">
                <div class="activity-box" style="justify-content:center; opacity:.45;">
                    SYSTEM READY
                </div>
            </div>

            <div class="social-links">
                <a class="social-btn"
                    href="https://github.com/CX-0x1"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="GitHub"
                    aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>

                <a class="social-btn"
                    href="https://discord.com/users/1463597892462972969"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Discord"
                    aria-label="Discord">
                    <i class="fab fa-discord"></i>
                </a>

                <a class="social-btn"
                    href="https://github.com/CX-0x1"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Projects"
                    aria-label="Projects">
                    <i class="fas fa-code"></i>
                </a>
            </div>

            <div class="volume-control">
                <i id="vol-icon" class="fas fa-volume-mute volume-icon"></i>
                <input id="vol-slider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.3"
                    aria-label="Volume">
            </div>

            <div class="view-counter">
                <i class="fas fa-eye"></i>
                <span id="view-count">...</span>
            </div>

        </section>
    </main>

    <script>
        const DISCORD_ID = "1463597892462972969";

        const audio = document.getElementById("bg-music");
        const slider = document.getElementById("vol-slider");
        const volumeIcon = document.getElementById("vol-icon");

        const savedVolume = localStorage.getItem("cx_volume");
        let lastVolume = 0.3;

        if (savedVolume !== null) {
            const volume = Number(savedVolume);
            audio.volume = volume;
            slider.value = volume;

            if (volume > 0) {
                lastVolume = volume;
            }
        } else {
            audio.volume = 0.3;
            slider.value = 0.3;
        }

        function updateVolumeIcon(volume) {
            volumeIcon.className =
                "fas volume-icon " +
                (volume === 0
                    ? "fa-volume-mute"
                    : volume < 0.5
                        ? "fa-volume-down"
                        : "fa-volume-up");
        }

        updateVolumeIcon(audio.volume);

        volumeIcon.addEventListener("click", () => {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                slider.value = 0;
            } else {
                audio.volume = lastVolume || 0.3;
                slider.value = audio.volume;

                if (audio.paused) {
                    audio.play().catch(() => {});
                }
            }

            localStorage.setItem("cx_volume", audio.volume);
            updateVolumeIcon(audio.volume);
        });

        slider.addEventListener("input", event => {
            const volume = Number(event.target.value);

            audio.volume = volume;

            if (volume > 0) {
                lastVolume = volume;

                if (audio.paused) {
                    audio.play().catch(() => {});
                }
            }

            localStorage.setItem("cx_volume", volume);
            updateVolumeIcon(volume);
        });

        const snowCanvas = document.getElementById("snow-canvas");
        const snowContext = snowCanvas.getContext("2d");

        function resizeSnow() {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
        }

        resizeSnow();
        window.addEventListener("resize", resizeSnow);

        const flakes = Array.from({ length: 70 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 3 + 1,
            speed: Math.random() * 0.7 + 0.3
        }));

        function drawSnow() {
            snowContext.clearRect(
                0,
                0,
                snowCanvas.width,
                snowCanvas.height
            );

            snowContext.fillStyle = "rgba(255,255,255,.2)";

            flakes.forEach(flake => {
                flake.y += flake.speed;

                if (flake.y > snowCanvas.height) {
                    flake.y = -5;
                    flake.x = Math.random() * snowCanvas.width;
                }

                snowContext.beginPath();
                snowContext.arc(
                    flake.x,
                    flake.y,
                    flake.size,
                    0,
                    Math.PI * 2
                );
                snowContext.fill();
            });

            requestAnimationFrame(drawSnow);
        }

        drawSnow();

        async function fetchAvatar() {
            try {
                const response = await fetch(
                    `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
                );

                const result = await response.json();

                if (!result.success || !result.data.discord_user.avatar) {
                    return;
                }

                const user = result.data.discord_user;
                const extension = user.avatar.startsWith("a_")
                    ? "gif"
                    : "png";

                document.getElementById("avatar").src =
                    `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=512`;
            } catch (error) {
                console.error("Avatar could not be loaded:", error);
            }
        }

        function getActivityImage(activity) {
            if (!activity.assets || !activity.assets.large_image) {
                return "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            const image = activity.assets.large_image;

            if (image.startsWith("mp:external")) {
                const externalUrl = image.match(
                    /mp:external\/.*\/https\/(.*)/
                );

                if (externalUrl) {
                    return `https://${externalUrl[1]}`;
                }
            }

            if (activity.application_id) {
                return `https://cdn.discordapp.com/app-assets/${activity.application_id}/${image}.png`;
            }

            return "https://cdn.discordapp.com/embed/avatars/0.png";
        }

        function updatePresence(data) {
            if (!data) {
                return;
            }

            const user = data.discord_user;

            if (user && user.avatar) {
                const extension = user.avatar.startsWith("a_")
                    ? "gif"
                    : "png";

                document.getElementById("avatar").src =
                    `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=512`;
            }

            const statusDot = document.getElementById("status-dot");
            statusDot.className =
                `status-indicator status-${data.discord_status || "offline"}`;

            const customStatus = data.activities?.find(
                activity => activity.type === 4
            );

            const statusElement = document.getElementById("custom-status");

            if (customStatus?.state) {
                let statusHTML = "";

                if (customStatus.emoji) {
                    if (customStatus.emoji.id) {
                        statusHTML +=
                            `<img src="https://cdn.discordapp.com/emojis/${customStatus.emoji.id}.png"
                            alt=""
                            style="width:16px;height:16px;vertical-align:middle;margin-right:5px;">`;
                    } else if (customStatus.emoji.name) {
                        statusHTML += `${customStatus.emoji.name} `;
                    }
                }

                statusHTML += customStatus.state;
                statusElement.innerHTML = statusHTML;
            } else {
                statusElement.textContent = "SYSTEM ONLINE";
            }

            let activitiesHTML = "";

            if (data.listening_to_spotify && data.spotify) {
                const spotify = data.spotify;

                activitiesHTML += `
                    <div class="activity-box">
                        <img class="activity-img"
                            src="${spotify.album_art_url}"
                            alt="Spotify album art">

                        <div class="activity-info">
                            <div class="activity-header">
                                Listening to Spotify
                            </div>

                            <div class="activity-name">
                                ${spotify.song}
                            </div>

                            <div class="activity-details">
                                ${spotify.artist}
                            </div>
                        </div>

                        <div class="bars">
                            <div class="bar"></div>
                            <div class="bar" style="animation-delay:.1s"></div>
                            <div class="bar" style="animation-delay:.2s"></div>
                        </div>
                    </div>
                `;
            }

            const activities = (data.activities || []).filter(activity =>
                activity.type !== 4 &&
                activity.id !== "spotify:1"
            );

            activities.forEach(activity => {
                activitiesHTML += `
                    <div class="activity-box">
                        <img class="activity-img"
                            src="${getActivityImage(activity)}"
                            alt="Activity image">

                        <div class="activity-info">
                            <div class="activity-header">
                                Active Application
                            </div>

                            <div class="activity-name">
                                ${activity.name || "Unknown Application"}
                            </div>

                            <div class="activity-details">
                                ${activity.state || activity.details || ""}
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById("activities-wrapper").innerHTML =
                activitiesHTML ||
                `<div class="activity-box" style="justify-content:center;opacity:.45;">
                    NO ACTIVE ACTIVITY
                </div>`;
        }

        function connectLanyard() {
            const socket = new WebSocket("wss://api.lanyard.rest/socket");

            socket.addEventListener("open", () => {
                socket.send(JSON.stringify({
                    op: 2,
                    d: {
                        subscribe_to_id: DISCORD_ID
                    }
                }));
            });

            socket.addEventListener("message", event => {
                const message = JSON.parse(event.data);

                if (
                    message.t === "INIT_STATE" ||
                    message.t === "PRESENCE_UPDATE"
                ) {
                    updatePresence(message.d);
                }
            });

            socket.addEventListener("close", () => {
                setTimeout(connectLanyard, 5000);
            });

            socket.addEventListener("error", () => {
                socket.close();
            });
        }

        async function initializeCounter() {
            const counter = document.getElementById("view-count");

            try {
                const response = await fetch(
                    "https://firebasedevapi.vercel.app/api/increment",
                    {
                        method: "POST"
                    }
                );

                const result = await response.json();
                counter.textContent = result.count ?? "N/A";
            } catch (error) {
                counter.textContent = "N/A";
            }
        }

        fetchAvatar();
        connectLanyard();
        initializeCounter();

        const dot = document.querySelector(".cursor-dot");
        const outline = document.querySelector(".cursor-outline");

        let mouseX = 0;
        let mouseY = 0;
        let dotX = 0;
        let dotY = 0;
        let outlineX = 0;
        let outlineY = 0;

        document.addEventListener("mousemove", event => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        function animateCursor() {
            dotX += (mouseX - dotX) * 0.2;
            dotY += (mouseY - dotY) * 0.2;

            outlineX += (mouseX - outlineX) * 0.1;
            outlineY += (mouseY - outlineY) * 0.1;

            dot.style.left = `${dotX}px`;
            dot.style.top = `${dotY}px`;

            outline.style.left = `${outlineX}px`;
            outline.style.top = `${outlineY}px`;

            requestAnimationFrame(animateCursor);
        }

        animateCursor();

        document
            .querySelectorAll("a, input, .social-btn, .profile-wrapper, .activity-box, .skill-badge, .badge, h1, .volume-icon")
            .forEach(element => {
                element.addEventListener("mouseenter", () => {
                    document.body.classList.add("cursor-hover");
                });

                element.addEventListener("mouseleave", () => {
                    document.body.classList.remove("cursor-hover");
                });
            });

        const card = document.querySelector(".card");

        let cardRotateX = 0;
        let cardRotateY = 0;
        let mouseInside = false;

        document.addEventListener("mouseenter", () => {
            mouseInside = true;
        });

        document.addEventListener("mouseleave", () => {
            mouseInside = false;
        });

        function animateCard() {
            if (window.innerWidth <= 768) {
                card.style.transform = "none";
                requestAnimationFrame(animateCard);
                return;
            }

            let targetX = 0;
            let targetY = 0;

            if (mouseInside) {
                targetX =
                    ((mouseY - window.innerHeight / 2) /
                        (window.innerHeight / 2)) *
                    -10;

                targetY =
                    ((mouseX - window.innerWidth / 2) /
                        (window.innerWidth / 2)) *
                    10;

                const rect = card.getBoundingClientRect();

                const glareX =
                    ((mouseX - rect.left) / rect.width) * 100;

                const glareY =
                    ((mouseY - rect.top) / rect.height) * 100;

                card.style.setProperty("--glare-x", `${glareX}%`);
                card.style.setProperty("--glare-y", `${glareY}%`);
            }

            cardRotateX += (targetX - cardRotateX) * 0.1;
            cardRotateY += (targetY - cardRotateY) * 0.1;

            card.style.transform =
                `perspective(1000px) rotateX(${cardRotateX}deg) rotateY(${cardRotateY}deg)`;

            requestAnimationFrame(animateCard);
        }

        animateCard();

        let audioContext;
        let analyser;
        let audioSource;

        const visualizerCanvas =
            document.getElementById("audio-visualizer");

        const visualizerContext =
            visualizerCanvas.getContext("2d");

        function resizeVisualizer() {
            visualizerCanvas.width = window.innerWidth;
            visualizerCanvas.height =
                window.innerHeight * 0.25;
        }

        resizeVisualizer();
        window.addEventListener("resize", resizeVisualizer);

        function initializeVisualizer() {
            if (audioContext) {
                return;
            }

            try {
                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                audioContext = new AudioContext();

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                analyser.smoothingTimeConstant = 0.92;

                audioSource =
                    audioContext.createMediaElementSource(audio);

                audioSource.connect(analyser);
                analyser.connect(audioContext.destination);

                drawVisualizer();
            } catch (error) {
                console.error("Visualizer error:", error);
            }
        }

        function drawVisualizer() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);

                analyser.getByteFrequencyData(dataArray);

                visualizerContext.clearRect(
                    0,
                    0,
                    visualizerCanvas.width,
                    visualizerCanvas.height
                );

                const usefulBins =
                    Math.floor(bufferLength * 0.7);

                const halfWidth =
                    visualizerCanvas.width / 2;

                const barWidth =
                    halfWidth / usefulBins;

                for (let index = 0; index < usefulBins; index++) {
                    const height =
                        (dataArray[index] / 255) *
                        visualizerCanvas.height *
                        0.8;

                    const gradient =
                        visualizerContext.createLinearGradient(
                            0,
                            visualizerCanvas.height - height,
                            0,
                            visualizerCanvas.height
                        );

                    gradient.addColorStop(0, "#d4af37");
                    gradient.addColorStop(1, "rgba(212,175,55,0)");

                    visualizerContext.fillStyle = gradient;

                    const leftX = index * barWidth;
                    const rightX =
                        visualizerCanvas.width -
                        (index + 1) * barWidth;

                    visualizerContext.fillRect(
                        leftX,
                        visualizerCanvas.height - height,
                        barWidth - 1,
                        height
                    );

                    visualizerContext.fillRect(
                        rightX,
                        visualizerCanvas.height - height,
                        barWidth - 1,
                        height
                    );
                }
            }

            draw();
        }

        window.addEventListener("load", () => {
            const loader = document.getElementById("loader");
            const loaderContent =
                document.querySelector(".loader-content");

            loaderContent.innerHTML =
                `<div class="click-text">CLICK TO ENTER</div>`;

            loader.addEventListener("click", () => {
                loader.style.opacity = "0";
                loader.style.visibility = "hidden";

                const video = document.getElementById("bg-video");

                if (video.paused) {
                    video.play().catch(() => {});
                }

                initializeVisualizer();

                if (audio.volume > 0) {
                    audio.play().catch(() => {});
                }
            }, { once: true });
        });
    </script>

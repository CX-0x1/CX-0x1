<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CX_0x1 | SYSTEM MASTER</title>

    <link rel="icon" type="image/jpeg" href="CX_logo.jpg">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f0e68c;
            --dark: #050505;
            --card: rgba(10, 10, 10, .72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            background: var(--dark);
            isolation: isolate;
        }

        /* ARKA PLAN VİDEOSU */

        #bg-video {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(3px) brightness(.55);
            transform: scale(1.05);
            pointer-events: none;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: radial-gradient(
                rgba(255, 255, 255, .13) 1px,
                transparent 1px
            );
            background-size: 25px 25px;
            content: "";
            pointer-events: none;
        }

        #snow-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #audio-visualizer {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 4;
            width: 100%;
            height: 25vh;
            pointer-events: none;
        }

        /* LOADER */

        #loader {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            transition: opacity .5s ease, visibility .5s ease;
        }

        .loader-content {
            text-align: center;
        }

        .spinner {
            width: 52px;
            height: 52px;
            margin: 0 auto 22px;
            border: 3px solid rgba(212, 175, 55, .3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .click-text {
            color: white;
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            text-shadow: 0 0 15px rgba(212, 175, 55, .7);
        }

        .click-text:hover {
            color: var(--gold-light);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ÖZEL MOUSE */

        .cursor-dot,
        .cursor-outline {
            position: fixed;
            z-index: 999999;
            display: block;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .cursor-dot {
            width: 7px;
            height: 7px;
            background: white;
        }

        .cursor-outline {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255, 255, 255, .45);
            transition:
                width .25s ease,
                height .25s ease,
                background .25s ease,
                border-color .25s ease;
        }

        .cursor-hover .cursor-dot {
            width: 5px;
            height: 5px;
            background: var(--gold);
        }

        .cursor-hover .cursor-outline {
            width: 44px;
            height: 44px;
            border-color: var(--gold);
            background: rgba(212, 175, 55, .12);
        }

        @media (hover: hover) and (pointer: fine) {
            html.custom-cursor-active,
            html.custom-cursor-active * {
                cursor: none !important;
            }
        }

        /* ANA ALAN */

        .main-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            padding: 40px 20px 80px;
            perspective: 1200px;
        }

        .card {
            position: relative;
            z-index: 10;
            width: min(440px, 94vw);
            min-height: 650px;
            padding: 40px 30px 105px;
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, .35);
            border-radius: 30px;
            background: var(--card);
            box-shadow: 0 0 35px rgba(212, 175, 55, .12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform-style: preserve-3d;
        }

        .card::after {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(
                circle at var(--glare-x, 50%) var(--glare-y, 50%),
                rgba(255, 255, 255, .09),
                transparent 60%
            );
            content: "";
            pointer-events: none;
        }

        .profile-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
        }

        .profile-wrapper:hover .profile-img {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, .6);
        }

        .status-indicator {
            position: absolute;
            right: 3px;
            bottom: 3px;
            width: 24px;
            height: 24px;
            border: 4px solid #0a0a0a;
            border-radius: 50%;
            background: #747f8d;
        }

        .status-online {
            background: #3ba55c;
            box-shadow: 0 0 12px #3ba55c;
        }

        .status-idle {
            background: #faa61a;
            box-shadow: 0 0 12px #faa61a;
        }

        .status-dnd {
            background: #ed4245;
            box-shadow: 0 0 12px #ed4245;
        }

        h1 {
            display: inline-block;
            margin-bottom: 8px;
            color: transparent;
            font-size: 2rem;
            background: linear-gradient(
                90deg,
                var(--gold),
                white,
                #888,
                var(--gold)
            );
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 300% center;
            }
        }

        .custom-status {
            display: block;
            margin-bottom: 18px;
            color: #bbb;
            font-size: .85rem;
            font-style: italic;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            margin-bottom: 25px;
            padding: 6px 16px;
            color: var(--gold);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(212, 175, 55, .3);
            border-radius: 10px;
            background: rgba(212, 175, 55, .1);
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .skill-badge {
            padding: 5px 11px;
            color: #ccc;
            font-size: .7rem;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 8px;
            background: rgba(255, 255, 255, .08);
            transition: .25s ease;
        }

        .skill-badge:hover {
            color: white;
            border-color: var(--gold);
            background: rgba(212, 175, 55, .15);
            transform: translateY(-2px);
        }

        /* DISCORD AKTİVİTELERİ */

        .activities-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .activity-box {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 18px;
            background: rgba(255, 255, 255, .04);
            transition: .25s ease;
        }

        .activity-box:hover {
            border-color: rgba(212, 175, 55, .45);
            background: rgba(255, 255, 255, .08);
            transform: scale(1.02);
        }

        .activity-img {
            flex-shrink: 0;
            width: 62px;
            height: 62px;
            object-fit: cover;
            border-radius: 14px;
        }

        .activity-info {
            min-width: 0;
            flex: 1;
        }

        .activity-header {
            color: var(--gold);
            font-size: .65rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .activity-name,
        .activity-details {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .activity-name {
            color: white;
            font-size: .9rem;
            font-weight: 600;
        }

        .activity-details {
            color: #999;
            font-size: .74rem;
        }

        /* SOSYAL BUTONLAR */

        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            padding: 17px;
            border: 1px solid rgba(212, 175, 55, .3);
            border-radius: 22px;
            background: rgba(212, 175, 55, .06);
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: white;
            font-size: 1.3rem;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            background: rgba(255, 255, 255, .06);
            transition: .25s ease;
        }

        .social-btn:hover {
            color: black;
            background: var(--gold);
            transform: translateY(-5px);
        }

        /* SES */

        .volume-control {
            position: absolute;
            right: 50%;
            bottom: 52px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            width: max-content;
            max-width: calc(100% - 30px);
            padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 30px;
            background: rgba(0, 0, 0, .5);
            transform: translateX(50%);
        }

        .volume-icon {
            width: 20px;
            color: #ccc;
            text-align: center;
            cursor: pointer;
        }

        .volume-icon:hover {
            color: var(--gold);
        }

        input[type="range"] {
            width: 100px;
            accent-color: var(--gold);
        }

        /* SAYAC */

        .view-counter {
            position: absolute;
            bottom: 15px;
            left: 20px;
            z-index: 30;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 5px 12px;
            color: #bbb;
            font-size: .8rem;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 20px;
            background: rgba(0, 0, 0, .35);
        }

        .footer-credit {
            position: fixed;
            bottom: 8px;
            left: 50%;
            z-index: 20;
            color: rgba(255, 255, 255, .6);
            font-size: .72rem;
            letter-spacing: 1px;
            transform: translateX(-50%);
        }

        @media (max-width: 768px) {
            .main-wrapper {
                align-items: flex-start;
                min-height: 100svh;
                padding: 25px 12px 85px;
            }

            .card {
                width: 100%;
                min-height: 680px;
                padding: 30px 18px 100px;
            }

            .cursor-dot,
            .cursor-outline,
            #audio-visualizer {
                display: none !important;
            }

            .volume-control {
                width: calc(100% - 36px);
                justify-content: center;
            }

            input[type="range"] {
                width: 100%;
            }

            .view-counter {
                right: 50%;
                left: auto;
                transform: translateX(50%);
            }

            .footer-credit {
                position: static;
                width: 100%;
                padding-top: 20px;
                text-align: center;
                transform: none;
            }
        }
    </style>
</head>

    <script>
        const DISCORD_ID = "959353098369921055";

        const video = document.getElementById("bg-video");
        const audio = document.getElementById("bg-music");
        const playIcon = document.getElementById("play-icon");
        const volumeIcon = document.getElementById("vol-icon");
        const slider = document.getElementById("vol-slider");

        /* VİDEO */

        video.muted = true;
        video.loop = true;
        video.playsInline = true;

        function startVideo() {
            video.play().catch(error => {
                console.warn("Video başlatılamadı:", error);
            });
        }

        window.addEventListener("load", startVideo);

        document.addEventListener("pointerdown", startVideo, {
            once: true
        });

        /* SES */

        const savedVolume = Number(
            localStorage.getItem("cx_volume") || ".3"
        );

        audio.volume = Math.max(0, Math.min(1, savedVolume));
        slider.value = audio.volume;

        let lastVolume = audio.volume || .3;
        let audioContext = null;
        let analyser = null;
        let audioSource = null;

        function updateVolumeIcon() {
            if (audio.volume === 0) {
                volumeIcon.className =
                    "fas fa-volume-mute volume-icon";
            } else if (audio.volume < .5) {
                volumeIcon.className =
                    "fas fa-volume-down volume-icon";
            } else {
                volumeIcon.className =
                    "fas fa-volume-up volume-icon";
            }
        }

        function updatePlayIcon() {
            playIcon.className = audio.paused
                ? "fas fa-play volume-icon"
                : "fas fa-pause volume-icon";
        }

        function initVisualizer() {
            if (audioContext) {
                return;
            }

            try {
                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                analyser.smoothingTimeConstant = .92;

                audioSource =
                    audioContext.createMediaElementSource(audio);

                audioSource.connect(analyser);
                analyser.connect(audioContext.destination);

                drawVisualizer();
            } catch (error) {
                console.warn("Visualizer başlatılamadı:", error);
            }
        }

        async function playMusic() {
            try {
                if (audio.volume <= 0) {
                    audio.volume = .3;
                    slider.value = .3;
                    lastVolume = .3;
                }

                await audio.play();

                initVisualizer();

                if (
                    audioContext &&
                    audioContext.state === "suspended"
                ) {
                    await audioContext.resume();
                }

                updatePlayIcon();
            } catch (error) {
                console.warn("Müzik başlatılamadı:", error);
            }
        }

        function toggleMusic() {
            if (audio.paused) {
                playMusic();
            } else {
                audio.pause();
                updatePlayIcon();
            }
        }

        playIcon.addEventListener("click", toggleMusic);

        playIcon.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleMusic();
            }
        });

        volumeIcon.addEventListener("click", () => {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                slider.value = 0;
            } else {
                audio.volume = lastVolume || .3;
                slider.value = audio.volume;

                if (audio.paused) {
                    playMusic();
                }
            }

            localStorage.setItem("cx_volume", audio.volume);
            updateVolumeIcon();
        });

        slider.addEventListener("input", event => {
            const value = Number(event.target.value);

            audio.volume = value;

            if (value > 0) {
                lastVolume = value;
            }

            localStorage.setItem("cx_volume", value);
            updateVolumeIcon();

            if (value > 0 && audio.paused) {
                playMusic();
            }
        });

        updateVolumeIcon();
        updatePlayIcon();

        /* LOADER */

        window.addEventListener("load", () => {
            const loader = document.getElementById("loader");
            const content = document.querySelector(".loader-content");

            content.innerHTML = `
                <div class="click-text">CLICK TO ENTER</div>
            `;

            loader.addEventListener("click", () => {
                loader.style.opacity = "0";
                loader.style.visibility = "hidden";

                startVideo();
                playMusic();
            }, { once: true });
        });

        /* KAR EFEKTİ */

        const snowCanvas = document.getElementById("snow-canvas");
        const snowContext = snowCanvas.getContext("2d");
        let flakes = [];

        function resizeSnow() {
            snowCanvas.width = innerWidth;
            snowCanvas.height = innerHeight;

            flakes = Array.from({
                length: innerWidth < 768 ? 35 : 75
            }, () => ({
                x: Math.random() * snowCanvas.width,
                y: Math.random() * snowCanvas.height,
                size: Math.random() * 3 + 1,
                speed: Math.random() * .7 + .3
            }));
        }

        function drawSnow() {
            snowContext.clearRect(
                0,
                0,
                snowCanvas.width,
                snowCanvas.height
            );

            snowContext.fillStyle = "rgba(255,255,255,.2)";

            flakes.forEach(flake => {
                flake.y += flake.speed;

                if (flake.y > snowCanvas.height + 5) {
                    flake.y = -5;
                    flake.x = Math.random() * snowCanvas.width;
                }

                snowContext.beginPath();
                snowContext.arc(
                    flake.x,
                    flake.y,
                    flake.size,
                    0,
                    Math.PI * 2
                );
                snowContext.fill();
            });

            requestAnimationFrame(drawSnow);
        }

        window.addEventListener("resize", resizeSnow);
        resizeSnow();
        drawSnow();

        /* ÖZEL MOUSE */

        const dot = document.querySelector(".cursor-dot");
        const outline = document.querySelector(".cursor-outline");

        const canUseCursor =
            matchMedia("(hover: hover) and (pointer: fine)").matches;

        let mouseX = innerWidth / 2;
        let mouseY = innerHeight / 2;
        let outlineX = mouseX;
        let outlineY = mouseY;

        if (canUseCursor) {
            document.documentElement.classList.add(
                "custom-cursor-active"
            );

            dot.style.left = `${mouseX}px`;
            dot.style.top = `${mouseY}px`;
            outline.style.left = `${outlineX}px`;
            outline.style.top = `${outlineY}px`;

            document.addEventListener("mousemove", event => {
                mouseX = event.clientX;
                mouseY = event.clientY;

                dot.style.left = `${mouseX}px`;
                dot.style.top = `${mouseY}px`;
            }, { passive: true });

            function animateCursor() {
                outlineX += (mouseX - outlineX) * .15;
                outlineY += (mouseY - outlineY) * .15;

                outline.style.left = `${outlineX}px`;
                outline.style.top = `${outlineY}px`;

                requestAnimationFrame(animateCursor);
            }

            animateCursor();

            document.addEventListener("mouseover", event => {
                if (event.target.closest(
                    "a, input, .activity-box, .profile-wrapper, .skill-badge, .volume-icon, .badge"
                )) {
                    document.body.classList.add("cursor-hover");
                }
            });

            document.addEventListener("mouseout", event => {
                if (!event.relatedTarget ||
                    !event.relatedTarget.closest?.(
                        "a, input, .activity-box, .profile-wrapper, .skill-badge, .volume-icon, .badge"
                    )) {
                    document.body.classList.remove("cursor-hover");
                }
            });
        }

        /* KART EĞİMİ */

        const card = document.querySelector(".card");

        document.addEventListener("mousemove", () => {
            if (innerWidth <= 768) {
                return;
            }

            const rotateX =
                ((mouseY - innerHeight / 2) /
                    (innerHeight / 2)) * -8;

            const rotateY =
                ((mouseX - innerWidth / 2) /
                    (innerWidth / 2)) * 8;

            const rect = card.getBoundingClientRect();

            card.style.transform =
                `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            card.style.setProperty(
                "--glare-x",
                `${((mouseX - rect.left) / rect.width) * 100}%`
            );

            card.style.setProperty(
                "--glare-y",
                `${((mouseY - rect.top) / rect.height) * 100}%`
            );
        });

        /* GÖRÜNÜM SAYACI */

        const viewCount = document.getElementById("view-count");
        const views = Number(localStorage.getItem("cx_views") || "0") + 1;

        localStorage.setItem("cx_views", views);
        viewCount.textContent = views;

        /* DISCORD LANYARD */

        const avatar = document.querySelector(".profile-img");
        const statusDot = document.getElementById("status-dot");
        const customStatus = document.getElementById("custom-status");
        const activitiesWrapper =
            document.getElementById("activities-wrapper");

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function getActivityImage(activity) {
            if (
                !activity.assets ||
                !activity.assets.large_image
            ) {
                return "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            const image = activity.assets.large_image;

            if (image.startsWith("mp:external")) {
                const match = image.match(/https\/(.+)/);

                return match
                    ? `https://${match[1]}`
                    : "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            if (!activity.application_id) {
                return "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            return `https://cdn.discordapp.com/app-assets/${
                activity.application_id
            }/${image}.png`;
        }

        function updateDiscord(data) {
            if (!data) {
                return;
            }

            if (data.discord_user?.avatar) {
                const extension =
                    data.discord_user.avatar.startsWith("a_")
                        ? "gif"
                        : "png";

                avatar.src =
                    `https://cdn.discordapp.com/avatars/` +
                    `${data.discord_user.id}/` +
                    `${data.discord_user.avatar}.${extension}?size=512`;
            }

            const status = data.discord_status || "offline";
            statusDot.className =
                `status-indicator status-${status}`;

            const activities = Array.isArray(data.activities)
                ? data.activities
                : [];

            const custom = activities.find(activity => activity.type === 4);

            customStatus.textContent =
                custom?.state || "Available";

            let html = "";

            activities
                .filter(activity =>
                    activity.type !== 4 &&
                    activity.id !== "spotify:1"
                )
                .forEach(activity => {
                    html += `
                        <div class="activity-box">
                            <img
                                class="activity-img"
                                src="${getActivityImage(activity)}"
                                alt="Aktivite görseli"
                            >

                            <div class="activity-info">
                                <div class="activity-header">
                                    Playing Now
                                </div>

                                <div class="activity-name">
                                    ${escapeHtml(activity.name)}
                                </div>

                                <div class="activity-details">
                                    ${escapeHtml(activity.state || "")}
                                </div>
                            </div>
                        </div>
                    `;
                });

            activitiesWrapper.innerHTML = html || `
                <div class="activity-box"
                    style="justify-content:center;opacity:.4;">
                    Inactive
                </div>
            `;
        }

        function connectLanyard() {
            const socket = new WebSocket(
                "wss://api.lanyard.rest/socket"
            );

            socket.addEventListener("open", () => {
                socket.send(JSON.stringify({
                    op: 2,
                    d: {
                        subscribe_to_id: DISCORD_ID
                    }
                }));
            });

            socket.addEventListener("message", event => {
                try {
                    const packet = JSON.parse(event.data);

                    if (
                        packet.t === "INIT_STATE" ||
                        packet.t === "PRESENCE_UPDATE"
                    ) {
                        updateDiscord(packet.d);
                    }
                } catch (error) {
                    console.warn("Discord verisi okunamadı:", error);
                }
            });

            socket.addEventListener("close", () => {
                setTimeout(connectLanyard, 5000);
            });

            socket.addEventListener("error", () => {
                socket.close();
            });
        }

        connectLanyard();

        /* SES GÖRSELLEŞTİRİCİSİ */

        const visualizer =
            document.getElementById("audio-visualizer");

        const visualizerContext = visualizer.getContext("2d");

        function resizeVisualizer() {
            visualizer.width = visualizer.offsetWidth;
            visualizer.height = visualizer.offsetHeight;
        }

        function drawVisualizer() {
            if (!analyser) {
                return;
            }

            const length = analyser.frequencyBinCount;
            const data = new Uint8Array(length);

            function draw() {
                requestAnimationFrame(draw);

                analyser.getByteFrequencyData(data);

                visualizerContext.clearRect(
                    0,
                    0,
                    visualizer.width,
                    visualizer.height
                );

                const usefulBins = Math.floor(length * .7);
                const halfWidth = visualizer.width / 2;
                const barWidth = halfWidth / usefulBins;

                for (let i = 0; i < usefulBins; i++) {
                    const height =
                        data[i] / 255 *
                        visualizer.height *
                        .8;

                    const gradient =
                        visualizerContext.createLinearGradient(
                            0,
                            visualizer.height - height,
                            0,
                            visualizer.height
                        );

                    gradient.addColorStop(0, "#d4af37");
                    gradient.addColorStop(
                        1,
                        "rgba(212,175,55,0)"
                    );

                    visualizerContext.fillStyle = gradient;

                    const left = i * barWidth;
                    const right =
                        visualizer.width -
                        ((i + 1) * barWidth);

                    visualizerContext.fillRect(
                        left,
                        visualizer.height - height,
                        barWidth - 1,
                        height
                    );

                    visualizerContext.fillRect(
                        right,
                        visualizer.height - height,
                        barWidth - 1,
                        height
                    );
                }
            }

            draw();
        }

        window.addEventListener("resize", resizeVisualizer);
        resizeVisualizer();
    </script>

</body>

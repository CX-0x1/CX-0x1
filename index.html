    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f0e68c;
            --bg: #050505;
            --card-bg: rgba(10, 10, 10, 0.68);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            color: #fff;
            background-color: var(--bg);
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 25px 25px;
            position: relative;
        }

        /* LOADER */

        #loader {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            transition: opacity .5s ease, visibility .5s ease;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            text-align: center;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(212, 175, 55, .3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .click-text {
            color: #fff;
            font-size: clamp(1rem, 4vw, 1.5rem);
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(212, 175, 55, .6);
            cursor: pointer;
            user-select: none;
        }

        .click-text:hover {
            color: var(--gold-light);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* BACKGROUND */

        #bg-video {
            position: fixed;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(3px) brightness(.55);
            transform: scale(1.05);
        }

        #snow-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #audio-visualizer {
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 4;
            width: 100%;
            height: 25vh;
            pointer-events: none;
        }

        /* CURSOR */

        .cursor-dot,
        .cursor-outline {
            position: fixed;
            z-index: 200000;
            pointer-events: none;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-dot {
            width: 6px;
            height: 6px;
            background: #fff;
        }

        .cursor-outline {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, .35);
            transition: width .25s ease, height .25s ease, background .25s ease,
                border-color .25s ease;
        }

        .cursor-hover .cursor-dot {
            width: 4px;
            height: 4px;
            background: var(--gold);
        }

        .cursor-hover .cursor-outline {
            width: 42px;
            height: 42px;
            border-color: rgba(212, 175, 55, .7);
            background: rgba(212, 175, 55, .1);
        }

        /* MAIN */

        .main-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        .card {
            position: relative;
            z-index: 10;
            width: min(440px, 90vw);
            max-height: calc(100vh - 80px);
            padding: 40px 36px 100px;
            overflow-y: auto;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, .3);
            border-radius: 32px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(212, 175, 55, .1);
            transform-style: preserve-3d;
            transition: box-shadow .4s ease, transform .1s ease;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) transparent;
        }

        .card::-webkit-scrollbar {
            width: 5px;
        }

        .card::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 20px;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            background: radial-gradient(
                circle at var(--glare-x, 50%) var(--glare-y, 50%),
                rgba(255, 255, 255, .08),
                transparent 60%
            );
        }

        .card:hover {
            box-shadow: 0 20px 60px rgba(212, 175, 55, .2);
        }

        /* PROFILE */

        .profile-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
            transform: translateZ(50px);
            transition: transform .4s ease;
        }

        .profile-wrapper:hover {
            transform: scale(1.08) rotate(5deg) translateZ(80px);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, .1);
            border-radius: 50%;
            background: #0a0a0a;
            transition: .4s ease;
        }

        .profile-wrapper:hover .profile-img {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, .45);
        }

        .status-indicator {
            position: absolute;
            right: 5px;
            bottom: 5px;
            z-index: 2;
            width: 24px;
            height: 24px;
            border: 4px solid #0a0a0a;
            border-radius: 50%;
            background: #747f8d;
        }

        .status-online {
            background: #3ba55c;
            box-shadow: 0 0 12px #3ba55c;
        }

        .status-idle {
            background: #faa61a;
            box-shadow: 0 0 12px #faa61a;
        }

        .status-dnd {
            background: #ed4245;
            box-shadow: 0 0 12px #ed4245;
        }

        /* TEXTS */

        h1 {
            display: inline-block;
            margin-bottom: 6px;
            color: transparent;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(
                90deg,
                var(--gold),
                #fff,
                #888,
                var(--gold)
            );
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, .4));
            animation: shine 5s linear infinite;
            transform: translateZ(40px);
        }

        @keyframes shine {
            to {
                background-position: 300% center;
            }
        }

        .custom-status {
            display: inline-block;
            max-width: 100%;
            margin-bottom: 17px;
            color: #bbb;
            font-size: .9rem;
            font-style: italic;
            line-height: 1.5;
            word-break: break-word;
            transform: translateZ(30px);
        }

        .badge {
            display: inline-block;
            margin-bottom: 25px;
            padding: 6px 16px;
            color: var(--gold);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(212, 175, 55, .25);
            border-radius: 10px;
            background: rgba(212, 175, 55, .1);
            box-shadow: 0 4px 0 rgba(212, 175, 55, .2);
            transform: translateZ(35px);
        }

        /* SKILLS */

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 0 8px;
            transform: translateZ(35px);
        }

        .skill-badge {
            padding: 5px 11px;
            color: #c0c0c0;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .5px;
            border: 1px solid rgba(192, 192, 192, .2);
            border-radius: 8px;
            background: rgba(192, 192, 192, .08);
            box-shadow: 0 3px 0 rgba(192, 192, 192, .15);
            transition: .3s ease;
        }

        .skill-badge:hover {
            color: #fff;
            border-color: #c0c0c0;
            background: rgba(192, 192, 192, .15);
            transform: translateY(-2px);
        }

        /* ACTIVITIES */

        .activities-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: translateZ(20px);
        }

        .activity-box {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 18px;
            background: rgba(255, 255, 255, .03);
            box-shadow: 0 4px 0 rgba(0, 0, 0, .3);
            transition: .3s ease;
        }

        .activity-box:hover {
            border-color: rgba(212, 175, 55, .35);
            background: rgba(255, 255, 255, .07);
            transform: scale(1.02);
        }

        .activity-img {
            flex-shrink: 0;
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 14px;
        }

        .activity-info {
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .activity-header {
            color: var(--gold);
            font-size: .65rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .activity-name {
            overflow: hidden;
            color: #fff;
            font-size: .92rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .activity-details {
            overflow: hidden;
            color: #999;
            font-size: .76rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* SPOTIFY BARS */

        .bars {
            display: flex;
            flex-shrink: 0;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            margin-left: auto;
        }

        .bar {
            width: 3px;
            height: 20%;
            background: #1db954;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                height: 20%;
            }

            50% {
                height: 100%;
            }
        }

        /* SOCIAL LINKS */

        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            padding: 17px;
            border: 1px solid rgba(212, 175, 55, .25);
            border-radius: 24px;
            background: rgba(212, 175, 55, .06);
            transform: translateZ(25px);
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: #fff;
            font-size: 1.35rem;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 14px;
            background: rgba(255, 255, 255, .05);
            transition: .3s ease;
        }

        .social-btn:hover {
            color: #000;
            background: var(--gold);
            box-shadow: 0 5px 15px rgba(212, 175, 55, .4);
            transform: translateY(-5px);
        }

        .social-btn svg {
            width: 22px;
            height: 22px;
        }

        /* VOLUME */

        .volume-control {
            position: absolute;
            left: 50%;
            bottom: 51px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 10px;
            width: max-content;
            max-width: calc(100% - 36px);
            padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 30px;
            background: rgba(0, 0, 0, .45);
            transform: translateX(-50%) translateZ(20px);
        }

        .volume-icon {
            width: 20px;
            color: #ccc;
            font-size: 1.05rem;
            text-align: center;
            cursor: pointer;
        }

        .volume-icon:hover {
            color: var(--gold);
        }

        input[type="range"] {
            width: 100px;
            height: 4px;
            appearance: none;
            outline: none;
            border-radius: 3px;
            background: rgba(255, 255, 255, .2);
        }

        input[type="range"]::-webkit-slider-thumb {
            width: 13px;
            height: 13px;
            appearance: none;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--gold);
        }

        /* VIEW COUNTER */

        .view-counter {
            position: absolute;
            left: 20px;
            bottom: 15px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            color: #bbb;
            font-size: .85rem;
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 20px;
            background: rgba(0, 0, 0, .3);
        }

        .view-counter i {
            animation: eye-pulse 2s infinite;
        }

        @keyframes eye-pulse {
            50% {
                opacity: .5;
            }
        }

        /* FOOTER */

        .footer-credit {
            position: fixed;
            left: 50%;
            bottom: 8px;
            z-index: 20;
            color: rgba(255, 255, 255, .55);
            font-size: .72rem;
            letter-spacing: 1px;
            transform: translateX(-50%);
        }

        /* TABLET AND MOBILE */

        @media (max-width: 768px) {
            body {
                min-height: 100svh;
                background-size: 16px 16px;
            }

            .main-wrapper {
                min-height: 100svh;
                padding: 25px 12px 85px;
                align-items: flex-start;
                perspective: none;
            }

            .card {
                width: 100%;
                max-width: 480px;
                max-height: none;
                margin: 0 auto;
                padding: 30px 18px 95px;
                border-radius: 24px;
                transform: none !important;
            }

            .card:hover {
                box-shadow: 0 10px 30px rgba(212, 175, 55, .1);
            }

            .profile-wrapper {
                width: 105px;
                height: 105px;
                transform: none;
            }

            .profile-wrapper:hover {
                transform: scale(1.04);
            }

            h1 {
                max-width: 100%;
                font-size: clamp(1.5rem, 8vw, 2rem);
                word-break: break-word;
            }

            .custom-status {
                font-size: .82rem;
            }

            .badge {
                margin-bottom: 20px;
                font-size: .68rem;
            }

            .skills-container {
                gap: 7px;
                padding: 0;
                margin-bottom: 20px;
            }

            .skill-badge {
                padding: 5px 9px;
                font-size: .65rem;
            }

            .activity-box {
                gap: 10px;
                padding: 12px;
                border-radius: 15px;
            }

            .activity-img {
                width: 52px;
                height: 52px;
                border-radius: 11px;
            }

            .activity-name {
                font-size: .82rem;
            }

            .activity-details {
                font-size: .7rem;
            }

            .social-links {
                gap: 9px;
                margin-top: 24px;
                padding: 13px 8px;
                border-radius: 18px;
            }

            .social-btn {
                width: 43px;
                height: 43px;
                font-size: 1.15rem;
                border-radius: 12px;
            }

            .volume-control {
                bottom: 51px;
                width: calc(100% - 36px);
                max-width: none;
                justify-content: center;
            }

            input[type="range"] {
                width: 100%;
                min-width: 0;
            }

            .view-counter {
                left: 50%;
                bottom: 14px;
                width: max-content;
                font-size: .78rem;
                transform: translateX(-50%);
            }

            .cursor-dot,
            .cursor-outline,
            #audio-visualizer {
                display: none;
            }

            .footer-credit {
                position: static;
                width: 100%;
                padding-bottom: 18px;
                text-align: center;
                transform: none;
                font-size: .68rem;
            }
        }

        /* KÜÇÜK TELEFONLAR */

        @media (max-width: 380px) {
            .main-wrapper {
                padding-right: 8px;
                padding-left: 8px;
            }

            .card {
                padding-right: 13px;
                padding-left: 13px;
            }

            .social-links {
                gap: 6px;
            }

            .social-btn {
                width: 39px;
                height: 39px;
            }

            .skill-badge {
                padding: 4px 7px;
                font-size: .6rem;
            }
        }

        /* DOKUNMATİK CİHAZLAR */

        @media (hover: none) and (pointer: coarse) {
            .card:hover,
            .activity-box:hover,
            .social-btn:hover,
            .profile-wrapper:hover,
            .skill-badge:hover {
                transform: none;
            }
        }

        ::selection {
            color: #fff;
            background: rgba(212, 175, 55, .4);
        }
    </style>
</head>

        const volumeIcon = document.getElementById("vol-icon");
        const playIcon = document.getElementById("play-icon");

        const VOLUME_STORAGE = "cx_volume";
        const savedVolume = localStorage.getItem(VOLUME_STORAGE);

        let lastVolume = .3;
        let currentVolume = savedVolume !== null
            ? Number(savedVolume)
            : .3;

        if (!Number.isFinite(currentVolume)) {
            currentVolume = .3;
        }

        audio.volume = Math.max(0, Math.min(1, currentVolume));
        slider.value = audio.volume;

        if (audio.volume > 0) {
            lastVolume = audio.volume;
        }

        function updateVolumeIcon(volume) {
            if (volume === 0) {
                volumeIcon.className = "fas fa-volume-mute volume-icon";
            } else if (volume < .5) {
                volumeIcon.className = "fas fa-volume-down volume-icon";
            } else {
                volumeIcon.className = "fas fa-volume-up volume-icon";
            }
        }

        function updatePlayIcon() {
            playIcon.className = audio.paused
                ? "fas fa-play volume-icon"
                : "fas fa-pause volume-icon";
        }

        async function playMusic() {
            try {
                if (audio.volume <= 0) {
                    audio.volume = .3;
                    slider.value = .3;
                    lastVolume = .3;
                    localStorage.setItem(VOLUME_STORAGE, ".3");
                    updateVolumeIcon(.3);
                }

                await audio.play();

                if (audioContext && audioContext.state === "suspended") {
                    await audioContext.resume();
                }

                initVisualizer();
                updatePlayIcon();
            } catch (error) {
                console.warn("Müzik başlatılamadı:", error);
            }
        }

        function toggleMusic() {
            if (audio.paused) {
                playMusic();
            } else {
                audio.pause();
                updatePlayIcon();
            }
        }

        playIcon.addEventListener("click", toggleMusic);

        playIcon.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleMusic();
            }
        });

        volumeIcon.addEventListener("click", () => {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                slider.value = 0;
            } else {
                audio.volume = lastVolume || .3;
                slider.value = audio.volume;

                if (audio.paused) {
                    playMusic();
                }
            }

            localStorage.setItem(VOLUME_STORAGE, audio.volume);
            updateVolumeIcon(audio.volume);
        });

        volumeIcon.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                volumeIcon.click();
            }
        });

        slider.addEventListener("input", event => {
            const value = Number(event.target.value);

            audio.volume = value;

            if (value > 0) {
                lastVolume = value;
            }

            localStorage.setItem(VOLUME_STORAGE, value);
            updateVolumeIcon(value);

            if (value > 0 && audio.paused) {
                playMusic();
            }
        });

        updateVolumeIcon(audio.volume);
        updatePlayIcon();

        /* ---------------- LOADER ---------------- */

        window.addEventListener("load", () => {
            const loader = document.getElementById("loader");
            const loaderContent = document.querySelector(".loader-content");

            loaderContent.innerHTML = `
                <div class="click-text">CLICK TO ENTER</div>
            `;

            loader.addEventListener("click", () => {
                loader.style.opacity = "0";
                loader.style.visibility = "hidden";

                video.play().catch(() => {});
                playMusic();
            }, { once: true });
        });

        /* ---------------- SNOW ---------------- */

        const snowCanvas = document.getElementById("snow-canvas");
        const snowContext = snowCanvas.getContext("2d");

        let flakes = [];

        function resizeSnow() {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;

            flakes = Array.from({
                length: window.innerWidth < 768 ? 35 : 75
            }, () => ({
                x: Math.random() * snowCanvas.width,
                y: Math.random() * snowCanvas.height,
                size: Math.random() * 3 + 1,
                speed: Math.random() * .7 + .3
            }));
        }

        function drawSnow() {
            snowContext.clearRect(
                0,
                0,
                snowCanvas.width,
                snowCanvas.height
            );

            snowContext.fillStyle = "rgba(255,255,255,.2)";

            flakes.forEach(flake => {
                flake.y += flake.speed;

                if (flake.y > snowCanvas.height + 5) {
                    flake.y = -5;
                    flake.x = Math.random() * snowCanvas.width;
                }

                snowContext.beginPath();
                snowContext.arc(
                    flake.x,
                    flake.y,
                    flake.size,
                    0,
                    Math.PI * 2
                );
                snowContext.fill();
            });

            requestAnimationFrame(drawSnow);
        }

        window.addEventListener("resize", resizeSnow);
        resizeSnow();
        drawSnow();

        /* ---------------- DISCORD LANYARD ---------------- */

        const avatar = document.querySelector(".profile-img");
        const statusDot = document.getElementById("status-dot");
        const customStatus = document.getElementById("custom-status");
        const activitiesWrapper = document.getElementById("activities-wrapper");

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function getAvatarUrl(user) {
            if (!user || !user.avatar) {
                return "CX_logo.jpg";
            }

            const extension = user.avatar.startsWith("a_")
                ? "gif"
                : "png";

            return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=512`;
        }

        function getActivityImage(activity) {
            if (!activity.assets || !activity.assets.large_image) {
                return "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            const image = activity.assets.large_image;

            if (image.startsWith("mp:external")) {
                const match = image.match(/https\/(.+)/);

                return match
                    ? `https://${match[1]}`
                    : "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            if (!activity.application_id) {
                return "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            return `https://cdn.discordapp.com/app-assets/${activity.application_id}/${image}.png`;
        }

        function updateDiscord(data) {
            if (!data) {
                return;
            }

            if (data.discord_user) {
                const discordAvatar = getAvatarUrl(data.discord_user);

                if (discordAvatar !== "CX_logo.jpg") {
                    avatar.src = discordAvatar;
                }
            }

            const status = data.discord_status || "offline";

            statusDot.className = `status-indicator status-${status}`;

            const activities = Array.isArray(data.activities)
                ? data.activities
                : [];

            const custom = activities.find(activity => activity.type === 4);

            if (custom && custom.state) {
                let statusHtml = "";

                if (custom.emoji) {
                    if (custom.emoji.id) {
                        statusHtml += `
                            <img
                                src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.png"
                                alt=""
                                style="width:16px;height:16px;vertical-align:middle;margin-right:5px;"
                            >
                        `;
                    } else if (custom.emoji.name) {
                        statusHtml += `${escapeHtml(custom.emoji.name)} `;
                    }
                }

                statusHtml += escapeHtml(custom.state);
                customStatus.innerHTML = statusHtml;
            } else {
                customStatus.textContent = "Available";
            }

            let html = "";

            if (data.listening_to_spotify && data.spotify) {
                const spotify = data.spotify;

                html += `
                    <div class="activity-box">
                        <img
                            src="${escapeHtml(spotify.album_art_url)}"
                            alt="Spotify albüm kapağı"
                            class="activity-img"
                        >

                        <div class="activity-info">
                            <div class="activity-header">
                                Listening to Spotify
                            </div>

                            <div class="activity-name">
                                ${escapeHtml(spotify.song)}
                            </div>

                            <div class="activity-details">
                                ${escapeHtml(spotify.artist)}
                            </div>
                        </div>

                        <div class="bars">
                            <div class="bar"></div>
                            <div class="bar" style="animation-delay:.1s"></div>
                            <div class="bar" style="animation-delay:.2s"></div>
                            <div class="bar" style="animation-delay:.3s"></div>
                        </div>
                    </div>
                `;
            }

            activities
                .filter(activity =>
                    activity.type !== 4 &&
                    activity.id !== "spotify:1"
                )
                .forEach(activity => {
                    html += `
                        <div class="activity-box">
                            <img
                                src="${getActivityImage(activity)}"
                                alt="Aktivite görseli"
                                class="activity-img"
                            >

                            <div class="activity-info">
                                <div class="activity-header">
                                    Playing Now
                                </div>

                                <div class="activity-name">
                                    ${escapeHtml(activity.name)}
                                </div>

                                <div class="activity-details">
                                    ${escapeHtml(activity.state || "")}
                                </div>
                            </div>
                        </div>
                    `;
                });

            activitiesWrapper.innerHTML = html || `
                <div class="activity-box"
                    style="justify-content:center;opacity:.3;">
                    Inactive
                </div>
            `;
        }

        function connectLanyard() {
            let socket;

            try {
                socket = new WebSocket("wss://api.lanyard.rest/socket");

                socket.addEventListener("open", () => {
                    socket.send(JSON.stringify({
                        op: 2,
                        d: {
                            subscribe_to_id: DISCORD_ID
                        }
                    }));
                });

                socket.addEventListener("message", event => {
                    try {
                        const packet = JSON.parse(event.data);

                        if (
                            packet.t === "INIT_STATE" ||
                            packet.t === "PRESENCE_UPDATE"
                        ) {
                            updateDiscord(packet.d);
                        }
                    } catch (error) {
                        console.warn("Discord verisi okunamadı:", error);
                    }
                });

                socket.addEventListener("close", () => {
                    setTimeout(connectLanyard, 5000);
                });

                socket.addEventListener("error", () => {
                    socket.close();
                });
            } catch (error) {
                console.warn("Lanyard bağlantısı kurulamadı:", error);
            }
        }

        connectLanyard();

        /* ---------------- VIEW COUNTER ---------------- */

        const viewCount = document.getElementById("view-count");
        const storedViews = Number(localStorage.getItem("cx_views") || 0);
        const newViews = storedViews + 1;

        localStorage.setItem("cx_views", newViews);
        viewCount.textContent = newViews;

        /* ---------------- CUSTOM CURSOR ---------------- */

        const dot = document.querySelector(".cursor-dot");
        const outline = document.querySelector(".cursor-outline");

        let mouseX = 0;
        let mouseY = 0;
        let dotX = 0;
        let dotY = 0;
        let outlineX = 0;
        let outlineY = 0;

        document.addEventListener("mousemove", event => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        function animateCursor() {
            dotX += (mouseX - dotX) * .2;
            dotY += (mouseY - dotY) * .2;

            outlineX += (mouseX - outlineX) * .1;
            outlineY += (mouseY - outlineY) * .1;

            dot.style.left = `${dotX}px`;
            dot.style.top = `${dotY}px`;

            outline.style.left = `${outlineX}px`;
            outline.style.top = `${outlineY}px`;

            requestAnimationFrame(animateCursor);
        }

        animateCursor();

        document.querySelectorAll(
            "a, input, .activity-box, .profile-wrapper, .skill-badge, .volume-icon"
        ).forEach(element => {
            element.addEventListener("mouseenter", () => {
                document.body.classList.add("cursor-hover");
            });

            element.addEventListener("mouseleave", () => {
                document.body.classList.remove("cursor-hover");
            });
        });

        /* ---------------- 3D CARD EFFECT ---------------- */

        const card = document.querySelector(".card");

        let rotateX = 0;
        let rotateY = 0;
        let mouseOutside = false;

        document.addEventListener("mouseleave", () => {
            mouseOutside = true;
        });

        document.addEventListener("mouseenter", () => {
            mouseOutside = false;
        });

        function animateCard() {
            if (window.innerWidth <= 768) {
                card.style.transform = "none";
                requestAnimationFrame(animateCard);
                return;
            }

            let targetX = 0;
            let targetY = 0;

            if (!mouseOutside) {
                const limit = 15;

                targetX =
                    ((mouseY - window.innerHeight / 2) /
                        (window.innerHeight / 2)) * -limit;

                targetY =
                    ((mouseX - window.innerWidth / 2) /
                        (window.innerWidth / 2)) * limit;

                const rect = card.getBoundingClientRect();

                const glareX =
                    ((mouseX - rect.left) / rect.width) * 100;

                const glareY =
                    ((mouseY - rect.top) / rect.height) * 100;

                card.style.setProperty("--glare-x", `${glareX}%`);
                card.style.setProperty("--glare-y", `${glareY}%`);
            }

            rotateX += (targetX - rotateX) * .1;
            rotateY += (targetY - rotateY) * .1;

            card.style.transform =
                `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            requestAnimationFrame(animateCard);
        }

        animateCard();

        /* ---------------- AUDIO VISUALIZER ---------------- */

        let audioContext = null;
        let analyser = null;
        let audioSource = null;

        const visualizer = document.getElementById("audio-visualizer");
        const visualizerContext = visualizer.getContext("2d");

        function resizeVisualizer() {
            visualizer.width = visualizer.offsetWidth;
            visualizer.height = visualizer.offsetHeight;
        }

        function initVisualizer() {
            if (audioContext) {
                return;
            }

            try {
                const AudioContext =
                    window.AudioContext || window.webkitAudioContext;

                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                analyser.smoothingTimeConstant = .92;

                audioSource = audioContext.createMediaElementSource(audio);
                audioSource.connect(analyser);
                analyser.connect(audioContext.destination);

                resizeVisualizer();
                drawVisualizer();
            } catch (error) {
                console.warn("Visualizer başlatılamadı:", error);
            }
        }

        function drawVisualizer() {
            if (!analyser) {
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);

                analyser.getByteFrequencyData(dataArray);

                visualizerContext.clearRect(
                    0,
                    0,
                    visualizer.width,
                    visualizer.height
                );

                const usefulBins = Math.floor(bufferLength * .7);
                const halfWidth = visualizer.width / 2;
                const barWidth = halfWidth / usefulBins;

                for (let i = 0; i < usefulBins; i++) {
                    const height =
                        (dataArray[i] * .8 / 255) *
                        visualizer.height;

                    const gradient = visualizerContext.createLinearGradient(
                        0,
                        visualizer.height - height,
                        0,
                        visualizer.height
                    );

                    gradient.addColorStop(0, "#d4af37");
                    gradient.addColorStop(1, "rgba(212,175,55,0)");

                    visualizerContext.fillStyle = gradient;

                    const leftX = i * barWidth;
                    const rightX =
                        visualizer.width - ((i + 1) * barWidth);

                    visualizerContext.fillRect(
                        leftX,
                        visualizer.height - height,
                        barWidth - 1,
                        height
                    );

                    visualizerContext.fillRect(
                        rightX,
                        visualizer.height - height,
                        barWidth - 1,
                        height
                    );
                }
            }

            draw();
        }

        window.addEventListener("resize", resizeVisualizer);
        resizeVisualizer();
    </script>

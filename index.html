<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CX_0x1 | SYSTEM MASTER</title>

    <meta name="description"
        content="CX_0x1 System Master digital workspace. Creative coding, web development and digital architecture.">

    <meta name="author" content="CX_0x1">
    <meta name="theme-color" content="#050505">

    <link rel="icon" type="image/jpeg" href="./CX_logo.jpg">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f0e68c;
            --dark: #050505;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            cursor: none !important;
        }

        html {
            background: #050505;
        }

        body {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            background: #050505;
            font-weight: 400;
            line-height: 1.5;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: auto;
            -moz-osx-font-smoothing: auto;
        }

        ::selection {
            color: #fff;
            background: rgba(212, 175, 55, .4);
        }

        /* BACKGROUND */

        #bg-video {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            filter: blur(3px) brightness(.58);
            transform: scale(1.05);
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(circle at center,
                    transparent 0%,
                    rgba(0, 0, 0, .42) 100%),
                radial-gradient(#222 1px, transparent 1px);
            background-size: auto, 25px 25px;
        }

        #snow-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #audio-visualizer {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 6;
            width: 100%;
            height: 25vh;
            pointer-events: none;
        }

        /* LOADER */

        #loader {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            transition: opacity .5s ease, visibility .5s ease;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, .3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .click-text {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(212, 175, 55, .5);
            transition: .3s ease;
        }

        .click-text:hover {
            color: var(--gold-light);
            transform: scale(1.03);
        }

        /* CURSOR */

        .cursor-dot,
        .cursor-outline {
            position: fixed;
            z-index: 200000;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .cursor-dot {
            width: 6px;
            height: 6px;
            background: #fff;
        }

        .cursor-outline {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, .35);
            transition:
                width .2s ease,
                height .2s ease,
                border-color .2s ease,
                background .2s ease;
        }

        .cursor-hover .cursor-dot {
            width: 4px;
            height: 4px;
            background: var(--gold);
        }

        .cursor-hover .cursor-outline {
            width: 40px;
            height: 40px;
            border-color: rgba(212, 175, 55, .65);
            background: rgba(212, 175, 55, .1);
        }

        /* CARD */

        .main-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            perspective: 1200px;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 440px;
            max-width: 90%;
            max-height: 96vh;
            margin: 20px auto;
            padding: 2.5rem 2.5rem 5.8rem;
            overflow: hidden;
            text-align: center;
            background: rgba(10, 10, 10, .68);
            border: 1px solid rgba(212, 175, 55, .3);
            border-radius: 32px;
            box-shadow: 0 0 30px rgba(212, 175, 55, .1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform-style: preserve-3d;
            transition: transform .1s ease-out, box-shadow .4s ease;
        }

        .card::after {
            position: absolute;
            inset: 0;
            z-index: 20;
            content: "";
            pointer-events: none;
            background: radial-gradient(
                circle at var(--glare-x, 50%) var(--glare-y, 50%),
                rgba(255, 255, 255, .08),
                transparent 60%
            );
        }

        .card:hover {
            box-shadow: 0 20px 60px rgba(212, 175, 55, .2);
        }

        /* PROFILE */

        .profile-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
            transform: translateZ(50px);
            transition: .5s cubic-bezier(.34, 1.56, .64, 1);
        }

        .profile-wrapper:hover {
            transform: scale(1.1) rotate(5deg) translateZ(80px);
        }

        .profile-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0a0a0a;
            border: 3px solid rgba(255, 255, 255, .1);
            border-radius: 50%;
            transition: .4s ease;
        }

        .profile-wrapper:hover .profile-img {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, .4);
        }

        .status-indicator {
            position: absolute;
            right: 6px;
            bottom: 6px;
            z-index: 2;
            width: 24px;
            height: 24px;
            background: #747f8d;
            border: 4px solid #0a0a0a;
            border-radius: 50%;
        }

        .status-online {
            background: #3ba55c;
            box-shadow: 0 0 12px #3ba55c;
        }

        .status-idle {
            background: #faa61a;
            box-shadow: 0 0 12px #faa61a;
        }

        .status-dnd {
            background: #ed4245;
            box-shadow: 0 0 12px #ed4245;
        }

        /* TEXT */

        h1 {
            display: inline-block;
            margin-bottom: 5px;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(
                90deg,
                #d4af37,
                #fff,
                #888,
                #d4af37
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, .4));
            transform: translateZ(40px);
            animation: shine 5s linear infinite;
        }

        h1:hover {
            transform: translateZ(60px) scale(1.06);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, .6));
        }

        @keyframes shine {
            to {
                background-position: 300% center;
            }
        }

        .custom-status {
            display: inline-block;
            min-height: 25px;
            margin-bottom: 15px;
            color: #bbb;
            font-size: .9rem;
            font-style: italic;
            transform: translateZ(30px);
        }

        /* SYSTEM MASTER */

        .badge {
            display: inline-block;
            margin-bottom: 25px;
            padding: 6px 16px;
            color: var(--gold);
            background: rgba(212, 175, 55, .1);
            border: 1px solid rgba(212, 175, 55, .2);
            border-radius: 10px;
            box-shadow: 0 4px 0 rgba(212, 175, 55, .2);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: 1px;
            transform: translateZ(35px);
            transition: all .3s ease;
        }

        .badge:hover {
            color: #fff;
            background: rgba(212, 175, 55, .22);
            border-color: var(--gold);
            box-shadow:
                0 6px 0 rgba(212, 175, 55, .3),
                0 0 18px rgba(212, 175, 55, .4);
            transform: translateY(-2px) translateZ(50px);
        }

        /* SKILLS */

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 0 10px;
            transform: translateZ(35px);
        }

        .skill-badge {
            display: inline-block;
            padding: 5px 12px;
            color: #c0c0c0;
            background: rgba(192, 192, 192, .08);
            border: 1px solid rgba(192, 192, 192, .2);
            border-radius: 8px;
            box-shadow: 0 3px 0 rgba(192, 192, 192, .15);
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .5px;
            transition: all .3s ease;
        }

        .skill-badge:hover {
            color: #fff;
            background: rgba(192, 192, 192, .15);
            border-color: #c0c0c0;
            box-shadow: 0 5px 0 rgba(192, 192, 192, .2);
            transform: translateY(-2px) translateZ(35px);
        }

        /* ACTIVITIES */

        .activities-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: translateZ(20px);
        }

        .activity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            text-align: left;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 18px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .3);
            transition: all .3s ease;
        }

        .activity-box:hover {
            background: rgba(255, 255, 255, .06);
            border-color: rgba(212, 175, 55, .3);
            transform: scale(1.02) translateZ(40px);
        }

        .activity-img {
            flex-shrink: 0;
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 14px;
        }

        .activity-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .activity-header {
            overflow: hidden;
            color: var(--gold);
            font-size: .65rem;
            font-weight: 800;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .activity-name {
            overflow: hidden;
            color: #fff;
            font-size: .95rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .activity-details {
            overflow: hidden;
            color: #999;
            font-size: .8rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* SOCIAL */

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            padding: 18px;
            background: rgba(212, 175, 55, .06);
            border: 1px solid rgba(212, 175, 55, .25);
            border-radius: 24px;
            transform: translateZ(25px);
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: #fff;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 14px;
            text-decoration: none;
            transition: all .3s ease;
        }

        .social-btn:hover {
            color: #000;
            background: var(--gold);
            box-shadow: 0 5px 15px rgba(212, 175, 55, .4);
            transform: translateY(-5px) translateZ(30px);
        }

        .social-icon,
        .patreon-logo,
        .control-svg,
        .eye-icon {
            display: block;
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* SPOTIFY */

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            margin-left: auto;
        }

        .bar {
            width: 3px;
            height: 20%;
            background: #1db954;
            animation: bounce 1s infinite ease-in-out;
        }

        @keyframes bounce {
            0%,
            100% {
                height: 20%;
            }

            50% {
                height: 100%;
            }
        }

        /* AUDIO */

        .volume-control {
            position: absolute;
            bottom: 48px;
            left: 50%;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, .4);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 30px;
            transform: translateX(-50%);
        }

        .control-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            color: #ccc;
            cursor: pointer !important;
            transition: .2s ease;
        }

        .control-icon:hover {
            color: var(--gold);
            transform: scale(1.12);
        }

        input[type="range"] {
            width: 100px;
            height: 4px;
            appearance: none;
            background: rgba(255, 255, 255, .2);
            border-radius: 2px;
            outline: none;
            cursor: pointer !important;
        }

        input[type="range"]::-webkit-slider-thumb {
            width: 12px;
            height: 12px;
            appearance: none;
            background: #fff;
            border-radius: 50%;
            cursor: pointer !important;
        }

        /* GÖZ VE SONSUZLUK */

        .view-counter {
            position: absolute;
            bottom: 15px;
            left: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-width: 72px;
            min-height: 42px;
            padding: 5px 12px;
            color: #bbb;
            background: rgba(0, 0, 0, .3);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 20px;
            cursor: none !important;
            font-size: .9rem;
            transform: translateZ(15px);
            transition:
                color .3s ease,
                background .3s ease,
                border-color .3s ease,
                box-shadow .3s ease,
                transform .3s ease;
        }

        .view-counter .eye-icon {
            display: block;
            width: 22px;
            height: 22px;
            fill: currentColor;
            animation: eye-pulse 2s infinite;
            transition:
                transform .35s ease,
                filter .35s ease;
        }

        .infinity-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            color: currentColor;
            font-family: Arial, sans-serif;
            font-size: 31px;
            font-weight: 400;
            line-height: 1;
            transition:
                color .35s ease,
                transform .35s ease,
                text-shadow .35s ease;
        }

        .view-counter:hover {
            color: var(--gold);
            background: rgba(212, 175, 55, .13);
            border-color: var(--gold);
            box-shadow:
                0 5px 15px rgba(212, 175, 55, .4),
                0 0 20px rgba(212, 175, 55, .25);
            transform: translateY(-5px) translateZ(30px) scale(1.05);
        }

        .view-counter:hover .eye-icon {
            fill: var(--gold);
            transform: rotate(-8deg) scale(1.15);
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, .85));
        }

        .view-counter:hover .infinity-icon {
            color: var(--gold);
            transform: rotate(5deg) scale(1.2);
            text-shadow:
                0 0 6px rgba(212, 175, 55, .9),
                0 0 16px rgba(212, 175, 55, .65);
        }

        @keyframes eye-pulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .45;
            }
        }

        .footer-credit {
            position: absolute;
            right: 20px;
            bottom: 18px;
            z-index: 30;
            color: rgba(255, 255, 255, .45);
            font-size: .65rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .footer-credit span {
            color: var(--gold);
            font-weight: 800;
            text-shadow: 0 0 8px rgba(212, 175, 55, .35);
        }

        @media (max-width: 768px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }

            .main-wrapper {
                min-height: 100vh;
                height: auto;
                align-items: flex-start;
                padding: 40px 0;
                perspective: none;
            }

            .card {
                width: 85%;
                max-width: 440px;
                margin: 0 auto;
                padding-bottom: 88px;
                transform: none !important;
            }

            .cursor-dot,
            .cursor-outline,
            #audio-visualizer {
                display: none !important;
            }

            .volume-control {
                bottom: 55px;
                width: 80%;
                justify-content: center;
            }

            input[type="range"] {
                flex: 1;
                width: auto;
            }

            .view-counter {
                left: 50%;
                width: max-content;
                transform: translateX(-50%);
            }

            .view-counter:hover {
                transform: translateX(-50%) translateY(-5px) scale(1.05);
            }

            .footer-credit {
                right: 50%;
                bottom: 17px;
                transform: translateX(50%);
            }

            * {
                cursor: auto !important;
            }
        }
    </style>
</head>

                <a href="mailto:codexservices1434@gmail.com"
                    class="social-btn"
                    title="E-mail"
                    aria-label="E-mail">

                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-13Zm2.5-.5a.5.5 0 0 0-.3.1L12 11l7.8-5.9a.5.5 0 0 0-.3-.1h-15Zm15.5 2.6-7.4 5.6a1 1 0 0 1-1.2 0L4 7.6v10.9c0 .28.22.5.5.5h15a.5.5 0 0 0 .5-.5V7.6Z"/>
                    </svg>
                </a>

                <a href="https://www.patreon.com/cw/CX_0x1"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-btn"
                    title="Patreon"
                    aria-label="Patreon">

                    <svg class="patreon-logo"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24">

                        <path fill="currentColor"
                            d="M22.957 7.21c-.004-3.064-2.391-5.576-5.191-6.482c-3.478-1.125-8.064-.962-11.384.604C2.357 3.231 1.093 7.391 1.046 11.54c-.039 3.411.302 12.396 5.369 12.46c3.765.047 4.326-4.804 6.068-7.141c1.24-1.662 2.836-2.132 4.801-2.618c3.376-.836 5.678-3.501 5.673-7.031">
                        </path>
                    </svg>
                </a>

            </div>

            <div class="volume-control">

                <span id="play-icon"
                    class="control-icon"
                    title="Play / Pause"
                    role="button"
                    tabindex="0">

                    <svg class="control-svg" viewBox="0 0 24 24">
                        <path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5Z"/>
                    </svg>
                </span>

                <span id="vol-icon"
                    class="control-icon"
                    title="Mute / Unmute"
                    role="button"
                    tabindex="0">

                    <svg class="control-svg" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.2v2.1A8 8 0 0 1 16.5 18v2.1A10 10 0 0 0 16.5 3.8Z"/>
                    </svg>
                </span>

                <input id="vol-slider"
                    type="range"
                    min="0"
                    max="1"
                    step=".01"
                    value=".3"
                    aria-label="Volume">
            </div>

            <!-- SAYI KALDIRILDI, YERİNE SONSUZLUK İŞARETİ EKLENDİ -->
            <div class="view-counter"
                title="Infinite views"
                aria-label="Infinite views">

                <svg class="eye-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <path d="M12 5c5.5 0 9.5 5.5 10.5 7-1 1.5-5 7-10.5 7S2.5 13.5 1.5 12C2.5 10.5 6.5 5 12 5Zm0 2C8.75 7 5.85 9.75 3.9 12 5.85 14.25 8.75 17 12 17s6.15-2.75 8.1-5C18.15 9.75 15.25 7 12 7Zm0 2.5A2.5 2.5 0 1 1 9.5 12a2.5 2.5 0 0 1 2.5-2.5Z"/>
                </svg>

                <span class="infinity-icon"
                    aria-hidden="true">∞</span>
            </div>

            <div class="footer-credit">
                by <span>BERAT</span>
            </div>

        </section>
    </main>

    <script>
        const DISCORD_ID = "959353098369921055";

        const audio = document.getElementById("bg-music");
        const playIcon = document.getElementById("play-icon");
        const volumeIcon = document.getElementById("vol-icon");
        const slider = document.getElementById("vol-slider");

        let lastVolume = .3;
        let audioContext;
        let analyser;
        let audioSource;

        /* MUSIC */

        const savedVolume = localStorage.getItem("cx_volume");

        if (savedVolume !== null) {
            audio.volume = Number(savedVolume);
            slider.value = savedVolume;

            if (audio.volume > 0) {
                lastVolume = audio.volume;
            }
        } else {
            audio.volume = .3;
            slider.value = .3;
        }

        function setPlayIcon() {
            playIcon.innerHTML = audio.paused
                ? `
                    <svg class="control-svg" viewBox="0 0 24 24">
                        <path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5Z"/>
                    </svg>
                `
                : `
                    <svg class="control-svg" viewBox="0 0 24 24">
                        <path d="M7 5h3v14H7V5Zm7 0h3v14h-3V5Z"/>
                    </svg>
                `;
        }

        function setVolumeIcon() {
            volumeIcon.innerHTML = audio.volume === 0
                ? `
                    <svg class="control-svg" viewBox="0 0 24 24">
                        <path d="m4 4 16 16-1.4 1.4-3.1-3.1A9.7 9.7 0 0 1 12 20l-5-4H3v-8h3.2L4 6l1.4-1.4L20 19.2 18.6 20.6 16 18v-2.5a4.5 4.5 0 0 0 0-7l-1.5-1.5a6.5 6.5 0 0 1 1.5 8.1L12 13.1V5L7 9H5.8l-2.4-2.4L4 4Z"/>
                    </svg>
                `
                : `
                    <svg class="control-svg" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.2v2.1A8 8 0 0 1 16.5 18v2.1A10 10 0 0 0 16.5 3.8Z"/>
                    </svg>
                `;
        }

        async function toggleMusic() {
            try {
                if (audio.paused) {
                    if (audio.volume <= 0) {
                        audio.volume = .3;
                        slider.value = .3;
                        lastVolume = .3;
                    }

                    await audio.play();

                    if (audioContext &&
                        audioContext.state === "suspended") {
                        await audioContext.resume();
                    }
                } else {
                    audio.pause();
                }

                setPlayIcon();
                setVolumeIcon();
            } catch (error) {
                console.error("Music error:", error);
            }
        }

        playIcon.addEventListener("click", toggleMusic);

        playIcon.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleMusic();
            }
        });

        volumeIcon.addEventListener("click", () => {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                slider.value = 0;
            } else {
                audio.volume = lastVolume || .3;
                slider.value = audio.volume;
            }

            localStorage.setItem("cx_volume", audio.volume);
            setVolumeIcon();
            setPlayIcon();
        });

        slider.addEventListener("input", event => {
            audio.volume = Number(event.target.value);

            if (audio.volume > 0) {
                lastVolume = audio.volume;

                if (audio.paused) {
                    audio.play().catch(() => {});
                }
            }

            localStorage.setItem("cx_volume", audio.volume);
            setVolumeIcon();
            setPlayIcon();
        });

        setPlayIcon();
        setVolumeIcon();

        /* SNOW */

        const snowCanvas = document.getElementById("snow-canvas");
        const snowContext = snowCanvas.getContext("2d");

        function resizeSnow() {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
        }

        resizeSnow();
        window.addEventListener("resize", resizeSnow);

        const flakes = Array.from({ length: 70 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 3 + 2,
            speed: Math.random() * .7 + .3
        }));

        function drawSnow() {
            snowContext.clearRect(
                0,
                0,
                snowCanvas.width,
                snowCanvas.height
            );

            snowContext.fillStyle = "rgba(255,255,255,.2)";

            flakes.forEach(flake => {
                flake.y += flake.speed;

                if (flake.y > snowCanvas.height) {
                    flake.y = -5;
                    flake.x = Math.random() * snowCanvas.width;
                }

                snowContext.beginPath();
                snowContext.arc(
                    flake.x,
                    flake.y,
                    flake.size,
                    0,
                    Math.PI * 2
                );
                snowContext.fill();
            });

            requestAnimationFrame(drawSnow);
        }

        drawSnow();

        /* LANYARD */

        function escapeHTML(value) {
            return String(value ?? "").replace(
                /[&<>"']/g,
                character => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                })[character]
            );
        }

        function getActivityImage(activity) {
            if (!activity.assets ||
                !activity.assets.large_image) {
                return "https://cdn.discordapp.com/embed/avatars/0.png";
            }

            const image = activity.assets.large_image;

            if (image.startsWith("mp:external")) {
                const match = image.match(
                    /mp:external\/.*\/https\/(.*)/
                );

                if (match) {
                    return "https://" + match[1];
                }
            }

            if (activity.application_id) {
                return `https://cdn.discordapp.com/app-assets/${activity.application_id}/${image}.png`;
            }

            return "https://cdn.discordapp.com/embed/avatars/0.png";
        }

        function updatePresence(data) {
            if (!data) {
                return;
            }

            document.getElementById("status-dot").className =
                "status-indicator status-" +
                (data.discord_status || "offline");

            const activities = Array.isArray(data.activities)
                ? data.activities
                : [];

            const customStatus = activities.find(
                activity => activity.type === 4
            );

            document.getElementById("custom-status").textContent =
                customStatus && customStatus.state
                    ? customStatus.state
                    : "SYSTEM ONLINE";

            let html = "";

            if (data.listening_to_spotify &&
                data.spotify) {
                const spotify = data.spotify;

                html += `
                    <div class="activity-box">
                        <img src="${escapeHTML(spotify.album_art_url)}"
                            class="activity-img"
                            alt="Spotify album art">

                        <div class="activity-info">
                            <div class="activity-header">
                                Listening to Spotify
                            </div>

                            <div class="activity-name">
                                ${escapeHTML(spotify.song)}
                            </div>

                            <div class="activity-details">
                                ${escapeHTML(spotify.artist)}
                            </div>
                        </div>

                        <div class="bars">
                            <div class="bar"></div>
                            <div class="bar" style="animation-delay:.1s"></div>
                            <div class="bar" style="animation-delay:.2s"></div>
                        </div>
                    </div>
                `;
            }

            activities
                .filter(activity =>
                    activity.type !== 4 &&
                    activity.id !== "spotify:1"
                )
                .forEach(activity => {
                    html += `
                        <div class="activity-box">
                            <img src="${getActivityImage(activity)}"
                                class="activity-img"
                                alt="Activity image">

                            <div class="activity-info">
                                <div class="activity-header">
                                    Playing Now
                                </div>

                                <div class="activity-name">
                                    ${escapeHTML(activity.name)}
                                </div>

                                <div class="activity-details">
                                    ${escapeHTML(
                                        activity.state ||
                                        activity.details ||
                                        ""
                                    )}
                                </div>
                            </div>
                        </div>
                    `;
                });

            document.getElementById(
                "activities-wrapper"
            ).innerHTML = html || `
                <div class="activity-box"
                    style="justify-content:center;opacity:.35;">
                    INACTIVE
                </div>
            `;
        }

        function connectLanyard() {
            const socket = new WebSocket(
                "wss://api.lanyard.rest/socket"
            );

            socket.addEventListener("open", () => {
                socket.send(JSON.stringify({
                    op: 2,
                    d: {
                        subscribe_to_id: DISCORD_ID
                    }
                }));
            });

            socket.addEventListener("message", event => {
                const message = JSON.parse(event.data);

                if (
                    message.t === "INIT_STATE" ||
                    message.t === "PRESENCE_UPDATE"
                ) {
                    updatePresence(message.d);
                }
            });

            socket.addEventListener("close", () => {
                setTimeout(connectLanyard, 5000);
            });

            socket.addEventListener("error", () => {
                socket.close();
            });
        }

        connectLanyard();

        /* FAST CURSOR */

        const dot = document.querySelector(".cursor-dot");
        const outline = document.querySelector(".cursor-outline");

        let mouseX = 0;
        let mouseY = 0;
        let dotX = 0;
        let dotY = 0;
        let outlineX = 0;
        let outlineY = 0;

        document.addEventListener("mousemove", event => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        function animateCursor() {
            dotX += (mouseX - dotX) * .8;
            dotY += (mouseY - dotY) * .8;

            outlineX += (mouseX - outlineX) * .55;
            outlineY += (mouseY - outlineY) * .55;

            dot.style.left = dotX + "px";
            dot.style.top = dotY + "px";

            outline.style.left = outlineX + "px";
            outline.style.top = outlineY + "px";

            requestAnimationFrame(animateCursor);
        }

        animateCursor();

        document.querySelectorAll(
            "a, .social-btn, .profile-wrapper, " +
            ".activity-box, .skill-badge, .badge, h1, " +
            ".view-counter, input[type=range], .control-icon"
        ).forEach(element => {
            element.addEventListener("mouseenter", () => {
                document.body.classList.add("cursor-hover");
            });

            element.addEventListener("mouseleave", () => {
                document.body.classList.remove("cursor-hover");
            });
        });

        /* CARD TILT */

        const card = document.querySelector(".card");

        let rotateX = 0;
        let rotateY = 0;
        let mouseOutside = false;

        document.addEventListener("mouseleave", () => {
            mouseOutside = true;
        });

        document.addEventListener("mouseenter", () => {
            mouseOutside = false;
        });

        function cardTilt() {
            if (window.innerWidth <= 768) {
                card.style.transform = "none";
                requestAnimationFrame(cardTilt);
                return;
            }

            let targetX = 0;
            let targetY = 0;

            if (!mouseOutside) {
                targetX =
                    ((mouseY - window.innerHeight / 2) /
                        (window.innerHeight / 2)) * -10;

                targetY =
                    ((mouseX - window.innerWidth / 2) /
                        (window.innerWidth / 2)) * 10;

                const rect = card.getBoundingClientRect();

                card.style.setProperty(
                    "--glare-x",
                    `${((mouseX - rect.left) / rect.width) * 100}%`
                );

                card.style.setProperty(
                    "--glare-y",
                    `${((mouseY - rect.top) / rect.height) * 100}%`
                );
            }

            rotateX += (targetX - rotateX) * .15;
            rotateY += (targetY - rotateY) * .15;

            card.style.transform =
                `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            requestAnimationFrame(cardTilt);
        }

        cardTilt();

        /* AUDIO VISUALIZER */

        const visualizer =
            document.getElementById("audio-visualizer");

        const visualizerContext =
            visualizer.getContext("2d");

        function resizeVisualizer() {
            visualizer.width = visualizer.offsetWidth;
            visualizer.height = visualizer.offsetHeight;
        }

        resizeVisualizer();
        window.addEventListener("resize", resizeVisualizer);

        function initVisualizer() {
            if (audioContext) {
                return;
            }

            try {
                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                analyser.smoothingTimeConstant = .92;

                audioSource =
                    audioContext.createMediaElementSource(audio);

                audioSource.connect(analyser);
                analyser.connect(audioContext.destination);

                drawVisualizer();
            } catch (error) {
                console.error("Visualizer error:", error);
            }
        }

        function drawVisualizer() {
            const length =
                analyser.frequencyBinCount;

            const data =
                new Uint8Array(length);

            function draw() {
                requestAnimationFrame(draw);

                analyser.getByteFrequencyData(data);

                visualizerContext.clearRect(
                    0,
                    0,
                    visualizer.width,
                    visualizer.height
                );

                const usefulBins =
                    Math.floor(length * .7);

                const halfWidth =
                    visualizer.width / 2;

                const barWidth =
                    halfWidth / usefulBins;

                for (let i = 0; i < usefulBins; i++) {
                    const height =
                        (data[i] / 255) *
                        visualizer.height *
                        .8;

                    const gradient =
                        visualizerContext.createLinearGradient(
                            0,
                            visualizer.height - height,
                            0,
                            visualizer.height
                        );

                    gradient.addColorStop(0, "#d4af37");
                    gradient.addColorStop(1, "rgba(212,175,55,0)");

                    visualizerContext.fillStyle = gradient;

                    visualizerContext.fillRect(
                        i * barWidth,
                        visualizer.height - height,
                        barWidth - 1,
                        height
                    );

                    visualizerContext.fillRect(
                        visualizer.width -
                        (i + 1) * barWidth,
                        visualizer.height - height,
                        barWidth - 1,
                        height
                    );
                }
            }

            draw();
        }

        /* ENTER */

        window.addEventListener("load", () => {
            const loader =
                document.getElementById("loader");

            loader.querySelector(
                ".loader-content"
            ).innerHTML =
                `<div class="click-text">CLICK TO ENTER</div>`;

            loader.addEventListener("click", () => {
                loader.style.opacity = "0";
                loader.style.visibility = "hidden";

                document.getElementById("bg-video")
                    .play()
                    .catch(() => {});

                initVisualizer();
                toggleMusic();
            }, {
                once: true
            });
        });
    </script>
